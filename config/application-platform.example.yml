server:
  port: 7050
  servlet:
    context-path: /shopify-marketing-web

spring:
  application:
    name: shopify-marketing-web

shopify:
  web:
    theme: theme2
    static-cache-seconds: 3600
    customer-import:
      temp-directory: REPLACE_WITH_WRITABLE_TEMP_DIRECTORY
      backend-base-url: REPLACE_WITH_SHOPIFY_MARKETING_URL
      allowed-backend-hosts: REPLACE_WITH_COMMA_SEPARATED_HOSTS
      max-bytes: 67108864

yskj:
  center:
    addr: REPLACE_WITH_CENTER_HOST
    port: REPLACE_WITH_CENTER_PORT
  app:
    id: REPLACE_WITH_APPLICATION_ID
  server:
    id: REPLACE_WITH_UNIQUE_SERVER_ID
    name: REPLACE_WITH_SERVER_NAME
    homepage: REPLACE_WITH_PUBLIC_HOMEPAGE
    mainpage: /dashboard
    noFilters: /health,/runstate
    ssoenable: 0
    gatewayservice:
    multipleAuthentication: 0
  mina:
    name:
    addr:
    port:
    dataid:
    unitid:
